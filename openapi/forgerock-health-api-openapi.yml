openapi: 3.2.0
info:
  title: ForgeRock Directory Services Health API
  description: HTTP Directory Access Protocol (HDAP) REST API for ForgeRock Directory Services (DS). Provides JSON-based access to directory data, translating HTTP operations into LDAP operations and mapping JSON resources to LDAP entries. Supports CRUD operations, search, and password management for directory entries.
  version: 7.4.0
  contact:
    name: ForgeRock
    url: https://www.forgerock.com
  license:
    name: Proprietary
    url: https://www.forgerock.com/terms
  x-provider: forgerock
  x-api: directory-services
servers:
- url: https://{deployment}/ds
  description: ForgeRock Directory Services HDAP endpoint
  variables:
    deployment:
      default: ds.example.com
      description: The DS deployment hostname
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Health
  description: Health and status monitoring
paths:
  /alive:
    get:
      operationId: healthCheck
      summary: Health check
      description: Returns the health status of the DS instance. Used by load balancers and monitoring systems.
      tags:
      - Health
      responses:
        '200':
          description: DS is healthy
          content:
            text/plain:
              schema:
                type: string
                examples:
                - Server is ALIVE
        '503':
          description: DS is not healthy
  /healthy:
    get:
      operationId: detailedHealthCheck
      summary: Detailed health check
      description: Returns detailed health status of the DS instance including replication state.
      tags:
      - Health
      responses:
        '200':
          description: DS is healthy and replicated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  replicationStatus:
                    type: string
        '503':
          description: DS is unhealthy or degraded
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 access token
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication (for directory bind)
