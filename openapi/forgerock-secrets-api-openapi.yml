components:
  schemas:
    esvSecretResponse:
      properties:
        _id:
          example: esv-mysecret1
          type: string
        activeVersion:
          example: '1'
          type: string
        description:
          example: My secret
          type: string
        encoding:
          example: generic
          type: string
        lastChangeDate:
          example: '1999-12-31T23:59:59Z'
          format: date-time
          type: string
        lastChangedBy:
          example: bjensen
          type: string
        loaded:
          type: boolean
        loadedVersion:
          example: '1'
          type: string
        useInPlaceholders:
          type: boolean
      required:
      - _id
      - activeVersion
      - description
      - encoding
      - lastChangeDate
      - lastChangedBy
      - loaded
      - loadedVersion
      - useInPlaceholders
      type: object
    esvSecretCreateRequest:
      properties:
        description:
          example: My secret
          maxLength: 1000
          type: string
        encoding:
          enum:
          - generic
          - pem
          - base64hmac
          - base64aes
          example: generic
          type: string
        useInPlaceholders:
          type: boolean
        valueBase64:
          example: ZGF0YQ==
          format: byte
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
          type: string
      required:
      - encoding
      - useInPlaceholders
      - valueBase64
      type: object
    esvSecretsListResponse:
      properties:
        pagedResultsCookie:
          example: 'null'
          type:
          - string
          - 'null'
        remainingPagedResults:
          example: 0
          type: integer
        result:
          items:
            $ref: '#/components/schemas/esvSecretResponse'
          type: array
        resultCount:
          example: 4
          type: integer
        totalPagedResults:
          example: 1
          type: integer
        totalPagedResultsPolicy:
          type: string
      required:
      - result
      - resultCount
      - pagedResultsCookie
      - totalPagedResultsPolicy
      - totalPagedResults
      - remainingPagedResults
      type: object
    esvSetDescriptionRequest:
      properties:
        description:
          example: My secret
          maxLength: 1000
          type: string
      required:
      - description
      type: object
    esvSecretVersionResponse:
      properties:
        createDate:
          example: '1999-12-31T23:59:59Z'
          format: date-time
          type: string
        loaded:
          example: false
          type: boolean
        status:
          example: DISABLED
          type: string
        version:
          example: latest
          pattern: ^latest$|^[0-9]+$
          type: string
      required:
      - version
      - createDate
      - loaded
      - status
      type: object
    esvSecretVersionCreateRequest:
      properties:
        valueBase64:
          example: ZGF0YQ==
          format: byte
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
          type: string
      required:
      - valueBase64
      type: object
    esvError:
      properties:
        code:
          example: 401
          type: integer
        message:
          example: unauthorized
          type: string
      required:
      - message
      - code
      type: object
    esvSecretVersionStatusRequest:
      properties:
        status:
          enum:
          - DISABLED
          - ENABLED
          example: DISABLED
          type: string
      required:
      - status
      type: object
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            fr:idc:certificate:*: Full access to certificates configuration
            fr:idc:certificate:read: Read only access to certificates configuration
            fr:idc:content-security-policy:*: Full access to content security policy configuration
            fr:idc:custom-domain:*: Full access to custom domains configuration
            fr:idc:esv:*: Full ESV access
            fr:idc:esv:read: Read ESVs
            fr:idc:esv:restart: Perform a restart of the ID Cloud workloads
            fr:idc:esv:update: Modify or delete ESVs
            fr:idc:federation:*: Full access to federation configuration
            fr:idc:promotion:*: Allows a user to trigger a promotion
            fr:idc:release:*: Full access to release configuration
            fr:idc:sso-cookie:*: Full access to SSO cookie configuration
            fr:idm:*: Grants full ESV access if user has openidm-admin role
          authorizationUrl: https://example.com/oauth/authorize
          tokenUrl: https://example.com/oauth/token
