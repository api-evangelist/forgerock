openapi: 3.2.0
info:
  description: '## Introduction

    The PingOne Advanced Identity Cloud REST API lets customers manage their PingOne Advanced Identity Cloud tenants. The API exposes access management and identity management endpoints, with additional endpoints specific to PingOne Advanced Identity Cloud tenant environments.


    We are now publishing the API spec in OpenAPI 3.0. For the legacy Swagger 2.0 spec, please download swagger.yaml, but note that it may not contain all new functionality.


    For full PingOne Advanced Identity Cloud documentation, please visit the docs website.

    ## Authenticating to the API

    The PingOne Advanced Identity Cloud REST API has two different authentication methods:


    - API key and secret: used for tenant read-only operations

    - Access token: used for access management operations, identity management operations or tenant write operations


    For a summary of how to use these authentication methods, refer to Authenticate to Advanced Identity Cloud REST API.'
  title: PingOne Advanced Identity Cloud Variables API
  version: 1.0.0
  x-logo:
    altText: Ping Identity logo
    backgroundColor: '#FAFAFA'
    url: https://cdn-docs.pingidentity.com/site-nav/ping-logo-horizontal.svg
servers:
- url: https://openam-example.id.forgerock.io/
security:
- OAuth2:
  - fr:idm:*
  - fr:idc:esv:*
  - fr:idc:esv:read
  - fr:idc:esv:update
  - fr:idc:esv:restart
  - fr:idc:promotion:*
tags:
- description: 'Variables are used to set configuration values that need to be different for each tenant environment. For example, an external service might need one URL in your development environment, but a different URL in your production environment.


    Variables are not versioned, and can be read back. They should not contain secrets.


    Variables are injected into Identity Cloud configuration when the underlying services are started or restarted.'
  name: Variables
paths:
  /environment/variables:
    get:
      parameters:
      - description: resource=2.0
        in: header
        name: Accept-API-Version
        schema:
          type: string
      - description: '_Accept-API-Version: resource=2.0_ only, maximum number of results returned by endpoint before paging'
        in: query
        name: _pageSize
        required: false
        schema:
          type: integer
          default: 25
          maximum: 100
          minimum: 1
      - description: '_Accept-API-Version: resource=2.0_ only, opaque data used for paging result data, can be used for paging instead of having to track pageSize and pagedResultsOffset'
        in: query
        name: _pagedResultsCookie
        required: false
        schema:
          type: string
          default: ''
      - description: '_Accept-API-Version: resource=2.0_ only, offset of the first result to be returned by endpoint'
        in: query
        name: _pagedResultsOffset
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - description: '_Accept-API-Version: resource=2.0_ only, returns ESVs with unapplied changes'
        in: query
        name: _onlyPending
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: successful operation
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
          content:
            application/json:
              schema: {}
        '401':
          description: unauthorized
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/esvError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/esvError'
      security:
      - OAuth2:
        - fr:idc:esv:*
        - fr:idc:esv:read
      tags:
      - Variables
      operationId: getAllVariables
      summary: Get all variables
  /environment/variables/{variableId}:
    delete:
      parameters:
      - description: resource=2.0
        in: header
        name: Accept-API-Version
        schema:
          type: string
      - description: ID of the variable
        in: path
        name: variableId
        required: true
        schema:
          type: string
          pattern: ^esv-[a-z0-9_-]{1,124}$
      responses:
        '200':
          description: successful operation
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/esvVariableResponse'
        '401':
          description: unauthorized
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/esvError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/esvError'
      security:
      - OAuth2:
        - fr:idc:esv:*
        - fr:idc:esv:update
      tags:
      - Variables
      operationId: deleteVariable
      summary: Delete a variable
    get:
      parameters:
      - description: resource=2.0
        in: header
        name: Accept-API-Version
        schema:
          type: string
      - description: ID of the variable
        in: path
        name: variableId
        required: true
        schema:
          type: string
          pattern: ^esv-[a-z0-9_-]{1,124}$
      responses:
        '200':
          description: successful operation
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/esvVariableResponse'
        '401':
          description: unauthorized
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/esvError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/esvError'
      security:
      - OAuth2:
        - fr:idc:esv:*
        - fr:idc:esv:read
      tags:
      - Variables
      operationId: getVariable
      summary: Get a variable
    post:
      parameters:
      - description: resource=2.0
        in: header
        name: Accept-API-Version
        schema:
          type: string
      - description: ID of the variable
        in: path
        name: variableId
        required: true
        schema:
          type: string
          pattern: ^esv-[a-z0-9_-]{1,124}$
      - in: query
        name: _action
        required: true
        schema:
          type: string
          enum:
          - setDescription
      responses:
        '200':
          description: successful operation
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
        '401':
          description: unauthorized
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/esvError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/esvError'
      security:
      - OAuth2:
        - fr:idc:esv:*
        - fr:idc:esv:update
      tags:
      - Variables
      operationId: actionVariable
      summary: Set a variable description
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/esvSetDescriptionRequest'
        description: The description of this variable
        required: true
    put:
      parameters:
      - description: resource=2.0
        in: header
        name: Accept-API-Version
        schema:
          type: string
      - description: ID of the variable
        in: path
        name: variableId
        required: true
        schema:
          type: string
          pattern: ^esv-[a-z0-9_-]{1,124}$
      responses:
        '200':
          description: successful operation
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/esvVariableResponse'
        '401':
          description: unauthorized
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/esvError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/esvError'
      security:
      - OAuth2:
        - fr:idc:esv:*
        - fr:idc:esv:update
      tags:
      - Variables
      description: Create or update a variable using a predefined name. Once created, a variable name cannot be changed.
      operationId: createVariables
      summary: Create or update a variable
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/esvVariableCreateUpdateRequest'
        description: JSON body of the new variable
        required: true
components:
  schemas:
    esvSetDescriptionRequest:
      properties:
        description:
          example: My secret
          maxLength: 1000
          type: string
      required:
      - description
      type: object
    esvVariableCreateUpdateRequest:
      properties:
        description:
          example: My variable
          maxLength: 1000
          type: string
        expressionType:
          enum:
          - string
          - list
          - array
          - object
          - bool
          - int
          - number
          - base64encodedinlined
          - keyvaluelist
          example: array
          type: string
        valueBase64:
          example: ZGF0YQ==
          format: byte
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
          type: string
      required:
      - valueBase64
      type: object
    esvError:
      properties:
        code:
          example: 401
          type: integer
        message:
          example: unauthorized
          type: string
      required:
      - message
      - code
      type: object
    esvVariableResponse:
      properties:
        _id:
          example: esv-myvariable1
          type: string
        description:
          example: My variable
          type: string
        expressionType:
          example: list
          type: string
        lastChangeDate:
          example: '1999-12-31T23:59:59Z'
          format: date-time
          type: string
        lastChangedBy:
          example: bjensen
          type: string
        loaded:
          example: false
          type: boolean
        valueBase64:
          example: ZGF0YQ==
          format: byte
          type: string
      required:
      - _id
      - lastChangedBy
      - expressionType
      - lastChangeDate
      - loaded
      - valueBase64
      - description
      type: object
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            fr:idc:certificate:*: Full access to certificates configuration
            fr:idc:certificate:read: Read only access to certificates configuration
            fr:idc:content-security-policy:*: Full access to content security policy configuration
            fr:idc:custom-domain:*: Full access to custom domains configuration
            fr:idc:esv:*: Full ESV access
            fr:idc:esv:read: Read ESVs
            fr:idc:esv:restart: Perform a restart of the ID Cloud workloads
            fr:idc:esv:update: Modify or delete ESVs
            fr:idc:federation:*: Full access to federation configuration
            fr:idc:promotion:*: Allows a user to trigger a promotion
            fr:idc:release:*: Full access to release configuration
            fr:idc:sso-cookie:*: Full access to SSO cookie configuration
            fr:idm:*: Grants full ESV access if user has openidm-admin role
          authorizationUrl: https://example.com/oauth/authorize
          tokenUrl: https://example.com/oauth/token
