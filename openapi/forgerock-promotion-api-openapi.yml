  /environment/promotion/rollback:
    post:
      parameters:
      - description: protocol=1.0,resource=1.0
        in: header
        name: Accept-API-Version
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Rollback process started successfully
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rollbackStart'
        '401':
          description: Invalid token
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            WWW-Authenticate:
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '409':
          description: 'Rollback request is conflicting with the current state of the environment. For example, the environment is not locked, or a promotion or rollback is already running.

            '
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Promotion
      description: Rollback the most recent configuration promotion.
      operationId: rollback
      summary: Rollback a promotion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/rollbackRequest'
        description: A request body with info required to initiate a rollback
        required: true
components:
  schemas:
    Error:
      properties:
        code:
          type: integer
        message:
          type: string
        status:
          type: string
      type: object
    promotionStartUnlocking:
      properties:
        description:
          example: Environment unlocking in progress
          type: string
        promotionId:
          example: ba594bbe-a589-4676-80a4-42975a56f5b6
          type: string
        result:
          example: unlocking
          type: string
      type: object
    promotionReportContent:
      properties:
        configChange:
          properties:
            added:
              items:
                $ref: '#/components/schemas/promotionCIMeta'
              type: array
              x-omitempty: true
            deleted:
              items:
                $ref: '#/components/schemas/promotionCIMeta'
              type: array
              x-omitempty: true
            modified:
              items:
                $ref: '#/components/schemas/promotionCIMeta'
              type: array
              x-omitempty: true
          type: object
        configItem:
          example: Email > Templates
          type: string
      type: object
    promotionProgress:
      properties:
        blockingError:
          default: false
          example: false
          type: boolean
        encryptedSecrets:
          items:
            example: mySecret
            type: string
          type: array
          x-omitempty: true
        globalLock:
          example: LOCKED
          type: string
        message:
          example: Environment ready for promotion
          type: string
        missingESVs:
          items:
            example: myVariable
            type: string
          type: array
          x-omitempty: true
        promotionId:
          example: 7e7634c3-406e-4d37-80a3-d34461c2f309
          type: string
        status:
          example: READY
          type: string
        timeStamp:
          example: '2022-02-01T14:17:02+01:00'
          type: string
        type:
          description: Either promotion or rollback depending on whether the report was for a config promotion or a config rollback
          example: promotion
          type: string
      type: object
    promotionRequest:
      properties:
        dryRun:
          description: A boolean denoting whether this a dry run
          type: boolean
        ignoreEncryptedSecrets:
          description: A boolean denoting whether or not to ignore encrypted secrets detected in config during the promotion
          type: boolean
          x-isnullable: false
        promoter:
          description: The name of the admin user who initiated the promotion
          type: string
          x-isnullable: false
        promotionDescription:
          description: Promoter specified note to make it easier for them to identify what was promoted
          type: string
          x-isnullable: false
        unlockEnvironmentsAfterPromotion:
          description: A boolean denoting whether or not to automatically unlock the environments after a successful promotion
          type: boolean
          x-isnullable: false
        zendeskTicketReference:
          description: A string denoting the Zendesk ticket reference to be added to the promotion commit message
          type: string
          x-isnullable: false
      required:
      - dryRun
      type: object
    promotionReportMeta:
      properties:
        createdDate:
          example: '2022-01-26T15:53:05Z'
          type: string
        dryRun:
          example: true
          type: boolean
          x-omitempty: false
        promoter:
          example: rocky.balboa
          type: string
        promotionId:
          example: 7575f185-cd0b-4823-b8b1-f677895291d4
          type: string
        reportId:
          example: d19e140-8325-4669-b9f3-1cd82784e24e
          type: string
        type:
          description: Either promotion or rollback depending on whether the report was for a config promotion or a config rollback
          example: promotion
          type: string
      type: object
    promotionLockState:
      properties:
        description:
          example: <meaningful when result=Error>
          type: string
        lowerEnv:
          properties:
            promotionId:
              example: ba594bbe-a589-4676-80a4-42975a56f5b6
              type: string
            proxyState:
              type: string
            state:
              type: string
          type: object
          x-omitempty: true
        promotionId:
          example: ba594bbe-a589-4676-80a4-42975a56f5b6
          type: string
        result:
          enum:
          - unlocked
          - locking
          - unlocking
          - locked
          - error
          example: locked
          type: string
        upperEnv:
          properties:
            promotionId:
              example: ba594bbe-a589-4676-80a4-42975a56f5b6
              type: string
            proxyState:
              type: string
            state:
              type: string
          type: object
          x-omitempty: true
      type: object
    InternalServerError:
      properties:
        code:
          example: 500
          type: integer
        message:
          example: something unexpected happened
          type: string
        status:
          example: Internal Server Error
          type: string
      type: object
    promotionStartLocking:
      properties:
        description:
          example: Environment lock in progress
