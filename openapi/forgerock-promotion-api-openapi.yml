  /environment/promotion/report/provisional:
    get:
      parameters:
      - description: protocol=1.0,resource=1.0
        in: header
        name: Accept-API-Version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promotionReport'
        '401':
          description: Invalid token
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            WWW-Authenticate:
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: Unexpected error
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Promotion
      description: Get a provisional report of changes since the last time the lower environment was promoted to the upper environment. The report generated is for informational purposes only and may not reflect all the changes in a full promotion. A dry-run promotion is always recommended prior to a full promotion between environments.
      operationId: getProvisionalReport
      summary: Get a provisional promotion report
  /environment/promotion/report/provisional-rollback:
    get:
      parameters:
      - description: protocol=1.0,resource=1.0
        in: header
        name: Accept-API-Version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promotionReport'
        '401':
          description: Invalid token
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            WWW-Authenticate:
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        default:
          description: Unexpected error
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Promotion
      description: Get a provisional rollback report of changes when we rollback the configuration to the previous promotion.
      operationId: getProvisionalRollbackReport
      summary: Get a provisional rollback report
  /environment/promotion/report/{reportId}:
    get:
      parameters:
      - description: protocol=1.0,resource=1.0
        in: header
        name: Accept-API-Version
        required: true
        schema:
          type: string
      - description: Promotion report unique identifier
        in: path
        name: reportId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promotionReport'
        '401':
          description: Invalid token
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            WWW-Authenticate:
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: report not found for given id
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected error
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Promotion
      description: Get a specific promotion report.
      operationId: getReport
      summary: Get a promotion report
  /environment/promotion/reports:
    get:
      parameters:
      - description: protocol=1.0,resource=1.0
        in: header
        name: Accept-API-Version
        required: true
        schema:
