openapi: 3.2.0
info:
  description: '## Introduction

    The PingOne Advanced Identity Cloud REST API lets customers manage their PingOne Advanced Identity Cloud tenants. The API exposes access management and identity management endpoints, with additional endpoints specific to PingOne Advanced Identity Cloud tenant environments.


    We are now publishing the API spec in OpenAPI 3.0. For the legacy Swagger 2.0 spec, please download swagger.yaml, but note that it may not contain all new functionality.


    For full PingOne Advanced Identity Cloud documentation, please visit the docs website.

    ## Authenticating to the API

    The PingOne Advanced Identity Cloud REST API has two different authentication methods:


    - API key and secret: used for tenant read-only operations

    - Access token: used for access management operations, identity management operations or tenant write operations


    For a summary of how to use these authentication methods, refer to Authenticate to Advanced Identity Cloud REST API.'
  title: PingOne Advanced Identity Cloud Promotion API
  version: 1.0.0
  x-logo:
    altText: Ping Identity logo
    backgroundColor: '#FAFAFA'
    url: https://cdn-docs.pingidentity.com/site-nav/ping-logo-horizontal.svg
servers:
- url: https://openam-example.id.forgerock.io/
security:
- OAuth2:
  - fr:idm:*
  - fr:idc:esv:*
  - fr:idc:esv:read
  - fr:idc:esv:update
  - fr:idc:esv:restart
  - fr:idc:promotion:*
tags:
- description: API endpoints related to self-service promotions
  name: Promotion
paths:
  /environment/promotion/lock:
    post:
      parameters:
      - description: protocol=1.0,resource=1.0
        in: header
        name: Accept-API-Version
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Lock has started on the environment
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promotionStartLocking'
        '401':
          description: Invalid token
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            WWW-Authenticate:
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '409':
          description: A promotion is already running
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promotionConflictingLockState'
        '500':
          description: Internal Server Error
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
      - Promotion
      description: Starts the lock process on the lower and upper environments
      operationId: lock
      summary: Lock environments
  /environment/promotion/lock/state:
    get:
      parameters:
      - description: protocol=1.0,resource=1.0
        in: header
        name: Accept-API-Version
        required: true
        schema:
          type: string
      - allowEmptyValue: true
        description: If set to true this parameter will only return the lock status of the environment the request is aimed at
        in: query
        name: localLockOnly
        schema:
          type: boolean
      responses:
        '200':
          description: Current status of lock on the environment
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promotionLockState'
        '401':
          description: Invalid token
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            WWW-Authenticate:
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '500':
          description: Internal Server Error
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
      - Promotion
      description: Get the lock status of the lower and upper environments.
      operationId: check-lock
      summary: Get lock status
  /environment/promotion/lock/{promotionId}:
    delete:
      parameters:
      - description: protocol=1.0,resource=1.0
        in: header
        name: Accept-API-Version
        required: true
        schema:
          type: string
      - description: Promotion unique identifier
        in: path
        name: promotionId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Environment is unlocked
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promotionUnlocked'
        '202':
          description: Unlock has started on the environment
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promotionStartUnlocking'
        '401':
          description: Invalid token
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            WWW-Authenticate:
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '409':
          description: Environment is currently locking or unlocking
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promotionConflictingLockState'
        '500':
          description: Internal Server Error
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
      - Promotion
      description: Start the unlock process on the lower and upper environments.
      operationId: unlock
      summary: Unlock environments
  /environment/promotion/promote:
    get:
      parameters:
      - description: protocol=1.0,resource=1.0
        in: header
        name: Accept-API-Version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promotionProgress'
        '401':
          description: Invalid token
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            WWW-Authenticate:
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
      - Promotion
      description: Get the status of a promotion, if one is in progress.
      operationId: progress
      summary: Get promotion status
    post:
      parameters:
      - description: protocol=1.0,resource=1.0
        in: header
        name: Accept-API-Version
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Promotion process started successfully
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promotionStart'
        '401':
          description: Invalid token
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            WWW-Authenticate:
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '409':
          description: 'Promotion request is conflicting with the current state of the environment. For example, the environment is not locked, or a promotion or rollback is already running.

            '
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
            X-ForgeRock-TransactionId:
              description: Identifies a specific transaction (API call)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Promotion
      description: Promote configuration from the lower environment to the upper environment.
      operationId: start
      summary: Run a promotion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/promotionRequest'
        description: A request body with info required to initiate a promotion
        required: true
  /environment/promotion/report:
    get:
      parameters:
      - description: protocol=1.0,resource=1.0
        in: header
        name: Accept-API-Version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/promotionReport'
        '401':
          description: Invalid token
          headers:
            Content-API-Version:
              description: resource=1.0
              schema:
