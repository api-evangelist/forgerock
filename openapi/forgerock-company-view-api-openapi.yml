openapi: 3.2.0
info:
  title: ForgeRock Autonomous Identity Company View API
  description: REST API for the ForgeRock Autonomous Identity analytics platform. Uses AI-driven analysis powered by Apache Spark to determine confidence scores, predictions, and recommendations for entitlement assignments. Provides endpoints for accessing entitlements, rules, applications, company views, and analytics data.
  version: 2022.11.0
  contact:
    name: ForgeRock
    url: https://www.forgerock.com
  license:
    name: Proprietary
    url: https://www.forgerock.com/terms
  x-provider: forgerock
  x-api: autonomous-identity
servers:
- url: https://{deployment}/autoid
  description: ForgeRock Autonomous Identity server
  variables:
    deployment:
      default: autoid.example.com
      description: The Autonomous Identity deployment hostname
security:
- bearerAuth: []
tags:
- name: Company View
  description: Company-wide analytics and dashboards
paths:
  /api/companyview:
    get:
      operationId: getCompanyView
      summary: ForgeRock Get company view analytics
      description: Retrieve company-wide analytics including confidence score distributions, entitlement statistics, and risk metrics across the entire organization.
      tags:
      - Company View
      responses:
        '200':
          description: Company-wide analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyView'
components:
  schemas:
    CompanyView:
      type: object
      description: Company-wide analytics summary
      properties:
        totalUsers:
          type: integer
        totalEntitlements:
          type: integer
        totalApplications:
          type: integer
        averageConfidenceScore:
          type: number
        confidenceDistribution:
          type: object
          properties:
            high:
              type: integer
            medium:
              type: integer
            low:
              type: integer
        riskSummary:
          type: object
          properties:
            highRiskUsers:
              type: integer
              description: Users with many low-confidence assignments
            highRiskEntitlements:
              type: integer
              description: Entitlements with low average confidence
            outlierAssignments:
              type: integer
              description: Assignments that differ from peer groups
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authentication token for Autonomous Identity API
