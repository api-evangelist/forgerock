swagger: '2.0'
info:
  description: >
    ## Introduction

    The PingOne Advanced Identity Cloud REST API lets customers manage their
    PingOne Advanced Identity Cloud tenants. The API exposes access management
    and identity management endpoints, with additional endpoints specific to
    PingOne Advanced Identity Cloud tenant environments.<br /><br />

    We are now publishing the API spec in OpenAPI 3.0. For the legacy Swagger
    2.0 spec, please download [swagger.yaml](swagger.yaml), but note that it may
    not contain all new functionality.<br /><br />

    For full PingOne Advanced Identity Cloud documentation, please visit [the
    docs website](https://docs.pingidentity.com/pingoneaic/latest/).

    ## Authenticating to the API

    The PingOne Advanced Identity Cloud REST API has two different
    authentication methods:

     - [API key and secret](https://docs.pingidentity.com/pingoneaic/latest/developer-docs/authenticate-to-rest-api-with-api-key-and-secret.html): used for tenant read-only operations
     - [Access token](https://docs.pingidentity.com/pingoneaic/latest/developer-docs/authenticate-to-rest-api-with-access-token.html): used for access management operations, identity management operations or tenant write operations

    For a summary of how to use these authentication methods, refer to
    [Authenticate to Advanced Identity Cloud REST
    API](https://docs.pingidentity.com/pingoneaic/latest/developer-docs/authenticate-to-rest-api-overview.html).
