definitions:
  BadRequest:
    properties:
      code:
        example: 400
        type: integer
      message:
        type: string
    type: object
  CName:
    properties:
      name:
        description: The canonical name of the domain to be validated.
        type: string
    required:
      - name
    type: object
  Certificate:
    properties:
      active:
        description: >-
          The active status of the certificate. Set this to true for the
          certificate to be made live on the loadbalancer.
        type: boolean
        x-omitempty: false
      certificate:
        description: Deprecated. Contains no data.
        type: string
        x-go-custom-tag: 'datastore:",noindex"'
      expireTime:
        description: The expiry time of the certificate. Not used in insert requests.
        type: string
      id:
        description: >-
          The unique identifier for the certificate resource. Not used in insert
          requests.
        type: string
      issuer:
        description: The issuer DN of the certificate
        type: string
      live:
        description: >-
          The live status of the certificate. This is automatically set by the
          system and indicates if the certificate is currently live externally.
        type: boolean
        x-omitempty: false
      subject:
        description: The subject DN of the certificate
        type: string
      subjectAlternativeNames:
        description: >-
          Domains associated by with the certificate via the Subject Alternative
          Name extension. The common name should be included in the SANs as
          well. Not used in insert requests.
        items:
          type: string
        type: array
      validFromTime:
        description: The notBefore time of the certificate.
        type: string
    type: object
  CertificateSigningRequest:
    properties:
      algorithm:
        description: >-
          The algorithm for the private key. The encryption algorithm will
          either be RSA-2048 or ECDSA P-256 depending on the algorithm choice.
          The default is RSA-2048.
        type: string
      certificateID:
        description: >-
          The ID of the certificate created from this CSR if the CSR has been
          completed.
        type: string
      createdDate:
        example: '2006-01-02T15:04:05Z07:00'
        type: string
      id:
        description: The unique identifier for the CSR
        type: string
      request:
        description: PEM formatted CSR.
        type: string
        x-go-custom-tag: 'datastore:",noindex"'
      subject:
        description: the CSR subject
        type: string
      subjectAlternativeNames:
        description: Additional domain or domains that the SSL certificate is securing
        items:
          type: string
        type: array
    type: object
  Conflict:
    properties:
      code:
        example: 409
        type: integer
      message:
        example: conflict
        type: string
    type: object
  ContentSecurityPolicy:
    properties:
      active:
        type: boolean
        x-omitempty: false
      directives:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
        x-omitempty: false
    type: object
  CookieDomains:
    properties:
      domains:
        description: Cookie domains
        items:
          type: string
        type: array
    type: object
  CreateCertificateRequest:
    properties:
      active:
        description: >-
          The active status of the certificate. Set this to true for the
          certificate to actively be served.
        type: boolean
      certificate:
        description: The PEM formatted certificate.
        type: string
      privateKey:
        description: >-
          The private key for the certificate. For security reasons, only insert
          requests include this field.
        type: string
    required:
      - certificate
      - privateKey
    type: object
  CreateCertificateSigningRequestRequest:
    default:
      algorithm: rsa
      subjectAlternativeNames: []
    properties:
      algorithm:
        description: >-
          The algorithm for the private key. The encryption algorithm will
          either be RSA-2048 or ECDSA P-256 depending on the algorithm choice.
          The default is RSA-2048.
        enum:
          - rsa
          - ecdsa
        type: string
      businessCategory:
        description: >-
          Category of business, such as "Private Organization", “Government
          Entity”, “Business Entity”, or “Non-Commercial Entity”. Relevant for
          EV certificates.
        example: Private Organization
        type: string
      city:
        example: Los Angeles
        type: string
      commonName:
        description: Domain name that the SSL certificate is securing
        example: id.example.com
        type: string
      country:
        description: Two-letter ISO-3166 country code
        example: US
        pattern: '[A-Z]{2}'
        type: string
      email:
        example: bob@example.com
        pattern: ^\S+@\S+$
        type: string
      jurisdictionCity:
        description: >-
          This field contains only information relevant to the Jurisdiction of
          Incorporation or Registration. Relevant for EV certificates.
        example: Los Angeles
        type: string
      jurisdictionCountry:
        description: >-
          This field contains only information relevant to the Jurisdiction of
          Incorporation or Registration. Relevant for EV certificates.
        example: US
        type: string
      jurisdictionState:
        description: >-
          This field contains only information relevant to the Jurisdiction of
          Incorporation or Registration. Relevant for EV certificates.
        example: California
        type: string
      organization:
        description: Full name of company
        example: example
        type: string
      organizationalUnit:
        description: Company section or department
        example: business
        type: string
      postalCode:
        example: '94105'
        type: string
      serialNumber:
        description: >-
          The Registration (or similar) Number assigned to the Subject by the
          Incorporating or Registration Agency in its Jurisdiction of
          Incorporation or Registration. Relevant for EV certificates.
        example: '1234567'
        type: string
      state:
        example: California
        type: string
      streetAddress:
        example: Nice Street
        type: string
      subjectAlternativeNames:
        description: Additional domain or domains that the SSL certificate is securing
        items:
          type: string
        type: array
    type: object
  CustomDomains:
    properties:
      domains:
        description: Custom domains
        items:
          type: string
        type: array
    type: object
  Error:
    properties:
      code:
        type: integer
      message:
        type: string
      status:
        type: string
    type: object
  FederationEnforcement:
    properties:
      groups:
        enum:
          - none
          - non-global
          - all
        type: string
    required:
      - groups
    type: object
  Forbidden:
    properties:
      code:
        example: 403
        type: integer
      message:
        example: forbidden
        type: string
    type: object
  InternalServerError:
    properties:
      code:
        example: 500
        type: integer
      message:
        example: something unexpected happened
        type: string
      status:
        example: Internal Server Error
        type: string
    type: object
  NotFound:
    properties:
      code:
        example: 404
        type: integer
      message:
        example: not found
        type: string
    type: object
  P1Connect:
    properties:
      active:
        type: boolean
      adminClientId:
        type: string
      defaultIssuer:
        type: string
      idpAuthEndpoint:
        type: string
      idpClientId:
        type: string
      idpEnabled:
        type: boolean
      idpIssuer:
        type: string
      idpTokenEndpoint:
        type: string
      idpWellKnownEndpoint:
        type: string
    type: object
  P1ConnectConfigureRequest:
    properties:
      adminDiscoveryEndpoint:
        description: >-
          The OIDC well-known endpoint for the PingOne environment where admin
          identities exist
        format: uri
        type: string
      consumerDiscoveryEndpoint:
        description: >-
          The OIDC well-known endpoint for the PingOne consumer environment
          being linked
        format: uri
        type: string
      pingOneAdminJwksEndpoint:
        description: The JWKS endpoint for the dynamically-registered admin client
        format: uri
        type: string
      ssoAppId:
        description: The client ID to use in the PingOne IDP definition for SSO
        type: string
    required:
      - adminDiscoveryEndpoint
      - consumerDiscoveryEndpoint
      - pingOneAdminJwksEndpoint
      - ssoAppId
    type: object
  P1ConnectConfigureResponse:
    properties:
      adminClientId:
        type: string
    type: object
  P1Connects:
    items:
      $ref: '#/definitions/P1Connect'
    type: array
  Release:
    properties:
      currentVersion:
        type: string
      nextUpgrade:
        format: date-time
        type: string
        x-nullable: true
    type: object
  SSOCookie:
    properties:
      name:
        pattern: '^[a-zA-Z0-9]{1,32}$'
        type: string
    required:
      - name
    type: object
  Unauthorized:
    properties:
      code:
        example: 401
        type: integer
      message:
        example: unauthorized
        type: string
    type: object
  UpdateCertificateRequest:
    properties:
      active:
        description: >-
          The active status of the certificate. Set this to true for the
          certificate to actively be served.
        type: boolean
    type: object
  UpdateCertificateSigningRequestRequest:
    properties:
      certificate:
        description: >-
          The matching signed certificate for the request. This should only be
          set on update requests to upload the certificate.
        type: string
    required:
      - certificate
    type: object
  default:
    properties:
      message:
        type: string
    type: object
  esvCount:
    properties:
      secrets:
        example: 10
        type: integer
      variables:
        example: 0
        type: integer
    required:
      - secrets
      - variables
    type: object
  esvError:
    properties:
      code:
        example: 401
        type: integer
      message:
        example: unauthorized
        type: string
    required:
      - message
      - code
    type: object
  esvRestartStatus:
    properties:
      restartStatus:
        enum:
          - restarting
          - ready
        example: restarting
        type: string
    required:
      - restartStatus
    type: object
  esvSecretCreateRequest:
    properties:
      description:
        example: My secret
        maxLength: 1000
        type: string
      encoding:
        enum:
          - generic
          - pem
          - base64hmac
          - base64aes
        example: generic
        type: string
      useInPlaceholders:
        type: boolean
      valueBase64:
        example: ZGF0YQ==
        format: byte
        pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
        type: string
    required:
      - encoding
      - useInPlaceholders
      - valueBase64
    type: object
  esvSecretResponse:
    properties:
      _id:
        example: esv-mysecret1
        type: string
      activeVersion:
        example: '1'
        type: string
      description:
        example: My secret
        type: string
      encoding:
        example: generic
        type: string
      lastChangeDate:
        example: '1999-12-31T23:59:59Z'
        format: date-time
        type: string
      lastChangedBy:
        example: bjensen
        type: string
      loaded:
        type: boolean
      loadedVersion:
        example: '1'
        type: string
      useInPlaceholders:
        type: boolean
    required:
      - _id
      - activeVersion
      - description
      - encoding
      - lastChangeDate
      - lastChangedBy
      - loaded
      - loadedVersion
      - useInPlaceholders
    type: object
  esvSecretVersionCreateRequest:
    properties:
      valueBase64:
        example: ZGF0YQ==
        format: byte
        pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
        type: string
    required:
      - valueBase64
    type: object
  esvSecretVersionResponse:
    properties:
      createDate:
        example: '1999-12-31T23:59:59Z'
        format: date-time
        type: string
      loaded:
        example: false
        type: boolean
      status:
        example: DISABLED
        type: string
      version:
        example: latest
        pattern: '^latest$|^[0-9]+$'
        type: string
    required:
      - version
      - createDate
      - loaded
      - status
    type: object
  esvSecretVersionStatusRequest:
    properties:
      status:
        enum:
          - DISABLED
          - ENABLED
        example: DISABLED
        type: string
    required:
