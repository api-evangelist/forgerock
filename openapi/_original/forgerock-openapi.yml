securityDefinitions:
  OAuth2:
    authorizationUrl: 'https://example.com/oauth/authorize'
    flow: accessCode
    scopes:
      'fr:idc:certificate:*': Full access to certificates configuration
      'fr:idc:certificate:read': Read only access to certificates configuration
      'fr:idc:content-security-policy:*': Full access to content security policy configuration
      'fr:idc:custom-domain:*': Full access to custom domains configuration
      'fr:idc:esv:*': Full ESV access
      'fr:idc:esv:read': Read ESVs
      'fr:idc:esv:restart': Perform a restart of the ID Cloud workloads
      'fr:idc:esv:update': Modify or delete ESVs
      'fr:idc:federation:*': Full access to federation configuration
      'fr:idc:promotion:*': Allows a user to trigger a promotion
      'fr:idc:release:*': Full access to release configuration
      'fr:idc:sso-cookie:*': Full access to SSO cookie configuration
      'fr:idm:*': Grants full ESV access if user has openidm-admin role
    tokenUrl: 'https://example.com/oauth/token'
    type: oauth2
security:
  - OAuth2:
      - 'fr:idm:*'
      - 'fr:idc:esv:*'
      - 'fr:idc:esv:read'
      - 'fr:idc:esv:update'
      - 'fr:idc:esv:restart'
      - 'fr:idc:promotion:*'
tags:
  - description: >
      Environment secrets and variables (ESVs) let you individually configure
      the development, staging, and production environments in your Identity
      Cloud tenant.
    name: Environment Secrets and Variables
  - description: >
      Variables are used to set configuration values that need to be different
      for each tenant environment. For example, an external service might need
      one URL in your development environment, but a different URL in your
      production environment.<br /><br />

      Variables are not versioned, and can be read back. They should not contain
      secrets.<br /><br />

      Variables are injected into Identity Cloud configuration when the
      underlying services are started or restarted.
    name: Variables
  - description: >
      Secrets are used to set configuration values that need encrypting. The
      values may or may not need to be different for each tenant environment.
      Authorization passwords and authentication signing keys are examples of
      secrets that might exist in your configuration.<br /><br />

      Secrets can have multiple versions enabled to allow rotation, and once set
      they cannot be read back.<br /><br />

      Secrets are injected into Identity Cloud configuration when the underlying
      services are started or restarted.
    name: Secrets
  - description: >-
      A restart of Identity Cloud services is used when new variables or secrets
      have been created and need to be injected into Identity Cloud
      configuration.
    name: Restart
  - description: >-
      Count is used to quickly identify how many variables and secrets are in an
      environment.
    name: Count
  - description: >
      Identity Cloud lets you run self-service promotions to move configuration
      between a sequential pair of tenant environments.
    name: Config Promotions
  - description: |
      API endpoints related to self-service promotions
    name: Promotion
  - description: >
      Identity Cloud gives you the ability to configure various environment
      settings via REST.
    name: Environment Configuration
  - description: Operations related to certificates
    name: Certificates
  - description: Operations related to certificate signing requests
    name: CSRs
  - description: Operations related to content security policy
    name: Content Security Policy
  - description: Operations related to cookie domains
    name: Cookie Domains
  - description: Operations related to custom domains
    name: Custom Domains
  - description: Operations related to federation enforcement
    name: Federation Enforcement
  - description: Operations related to release management
    name: Release
  - description: Operations related to single sign-on cookies
    name: SSO Cookie
x-components:
  parameters:
    X-ForgeRock-TransactionId:
      description: Permits setting a specific transaction ID for this request
      in: header
      name: ForgeRock-Transaction-ID
      required: false
      schema:
        type: string
    apiVersion:
      description: 'protocol=1.0,resource=1.0'
      in: header
      name: Accept-API-Version
      required: true
      type: string
    esvApiVersion:
      description: resource=2.0
      in: header
      name: Accept-API-Version
      type: string
    esvOnlyPending:
      default: false
      description: >-
        _Accept-API-Version: resource=2.0_ only, returns ESVs with unapplied
        changes
      in: query
      name: _onlyPending
      type: boolean
    esvPageSize:
      default: 25
      description: >-
        _Accept-API-Version: resource=2.0_ only, maximum number of results
        returned by endpoint before paging
      in: query
      maximum: 100
      minimum: 1
      name: _pageSize
      required: false
      type: integer
    esvPagedResultsCookie:
      default: ''
      description: >-
        _Accept-API-Version: resource=2.0_ only, opaque data used for paging
        result data, can be used for paging instead of having to track pageSize
        and pagedResultsOffset
      in: query
      name: _pagedResultsCookie
      required: false
      type: string
    esvPagedResultsOffset:
      default: 0
      description: >-
        _Accept-API-Version: resource=2.0_ only, offset of the first result to
        be returned by endpoint
      in: query
      minimum: 0
      name: _pagedResultsOffset
      required: false
      type: integer
    promotionId:
      description: Promotion unique identifier
      in: path
      name: promotionId
      required: true
      type: string
    reportId:
      description: Promotion report unique identifier
      in: path
      name: reportId
      required: true
      type: string
  requestBodies:
    ContentSecurityPolicy:
      content:
        application/json:
          schema:
            $ref: '#/definitions/ContentSecurityPolicy'
      description: Enforced content security policy to apply to the tenant
      required: true

