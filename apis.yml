- aid: forgerock:forgerock-secrets-api
  name: ForgeRock Secrets API
  description: >-
    Secrets are used to set configuration values that need encrypting. The values may or may not need
    to be different for each tenant environment. Authorization passwords and authentication signing keys
    are examples of secrets that might exist in your configuration.<br /><br />

    Secrets can have multiple versions enabled to allow rotation, and once set they cannot be read back.<br
    /><br />

    Secrets are injected into Identity Cloud configuration when the underlying services are started or
    restarted.
  humanURL: https://backstage.forgerock.com/docs/idcloud/latest
  baseURL: https://{tenant}.forgeblocks.com
  tags:
  - Secrets
  properties:
  - type: OpenAPI
    url: openapi/forgerock-secrets-api-openapi.yml
- aid: forgerock:forgerock-sso-cookie-api
  name: ForgeRock SSO Cookie API
  description: Operations related to single sign-on cookies
  humanURL: https://backstage.forgerock.com/docs/idcloud/latest
