  tags:
  - SSO Cookie
  properties:
  - type: OpenAPI
    url: openapi/forgerock-sso-cookie-api-openapi.yml
- aid: forgerock:forgerock-variables-api
  name: ForgeRock Variables API
  description: >-
    Variables are used to set configuration values that need to be different for each tenant environment.
    For example, an external service might need one URL in your development environment, but a different
    URL in your production environment.<br /><br />

    Variables are not versioned, and can be read back. They should not contain secrets.<br /><br />

    Variables are injected into Identity Cloud configuration when the underlying services are started
    or restarted.
  humanURL: https://backstage.forgerock.com/docs/idcloud/latest
  baseURL: https://{tenant}.forgeblocks.com
  tags:
  - Variables
  properties:
  - type: OpenAPI
    url: openapi/forgerock-variables-api-openapi.yml
